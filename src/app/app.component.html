<a class="skip-link" href="#main-content">Salta al contenuto principale</a>

@if (!authStore.isAuthenticated()) {
  <main id="main-content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
} @else {
  <nz-layout class="app-layout">
    <nz-sider
      class="menu-sidebar"
      nzCollapsible
      nzWidth="260px"
      [nzCollapsedWidth]="72"
      [nzCollapsed]="appStore.isCollapsed()"
      [nzTrigger]="null"
    >
      <app-sidebar />
    </nz-sider>
    <nz-layout class="main-layout">
      <nz-header class="main-header">
        <app-header />
      </nz-header>
      <nz-content class="main-content">
        <app-breadcrumb />
        <main id="main-content" tabindex="-1" class="content-container">
          <router-outlet></router-outlet>
        </main>
      </nz-content>
    </nz-layout>
  </nz-layout>
}

<!-- The modal (QR code, steps) is only needed when the account must set up two-factor authentication: load it on demand. -->
@defer (when authStore.twoFactorSetupRequired()) {
  <app-two-factor-setup-modal
    [isVisible]="authStore.twoFactorSetupRequired()"
    (completed)="onGlobal2FASetupCompleted()"
  />
}
