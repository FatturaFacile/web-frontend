<a class="skip-link" href="#main-content">{{ 'a11y.skipToContent' | translate }}</a>

@if (!authStore.isAuthenticated() || publicPage()) {
  <main id="main-content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
} @else {
  <nz-layout class="app-layout">
    <nz-sider
      class="menu-sidebar"
      nzCollapsible
      nzWidth="260px"
      [nzCollapsedWidth]="72"
      [nzCollapsed]="appStore.isCollapsed()"
      [nzTrigger]="null"
    >
      <app-sidebar role="navigation" [attr.aria-label]="'DESIGN_SYSTEM.NAV_MAIN' | translate" />
    </nz-sider>
    <nz-layout class="main-layout">
      <app-impersonation-banner />
      <nz-header class="main-header">
        <app-header />
      </nz-header>
      <nz-content class="main-content">
        <div class="content-container">
          <app-breadcrumb />
          <main id="main-content" tabindex="-1" class="main-outlet">
            <router-outlet></router-outlet>
          </main>
        </div>
      </nz-content>
    </nz-layout>
  </nz-layout>
  <app-global-search />
  <app-copilot-drawer />
  <app-contextual-help-drawer />
  <app-signature-request-host />
}

<app-toast-host />
<app-spotlight-tour-overlay />

<!-- The modal (QR code, steps) is only needed when the account must set up two-factor authentication: load it on demand. -->
@defer (when authStore.twoFactorSetupRequired()) {
  <app-two-factor-setup-modal
    [isVisible]="authStore.twoFactorSetupRequired()"
    (completed)="onGlobal2FASetupCompleted()"
  />
}
