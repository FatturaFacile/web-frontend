<nz-drawer
  [nzVisible]="open()"
  [nzTitle]="(alert() ? 'alerts.form.editTitle' : 'alerts.form.createTitle') | translate"
  [nzWidth]="500"
  (nzOnClose)="open.set(false)"
>
  <ng-container *nzDrawerContent>
    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="title">{{ "alerts.form.title" | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'validation.titleRequired' | translate">
          <input
            nz-input
            id="title"
            formControlName="title"
            [placeholder]="'alerts.form.titlePlaceholder' | translate"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="severity">{{ "alerts.form.severity" | translate }}</nz-form-label>
        <nz-form-control>
          <nz-select id="severity" formControlName="severity">
            <nz-option nzValue="info" [nzLabel]="'alerts.lblInformativoBlu' | translate" />
            <nz-option nzValue="warning" [nzLabel]="'alerts.lblAttenzioneArancione' | translate" />
            <nz-option nzValue="critical" [nzLabel]="'alerts.lblCriticoBloccanteRosso' | translate" />
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="message">{{ "alerts.form.message" | translate }}</nz-form-label>
        <nz-form-control>
          <textarea
            nz-input
            id="message"
            formControlName="message"
            rows="4"
            [placeholder]="'alerts.form.messagePlaceholder' | translate"
          ></textarea>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="is_active">{{ "alerts.form.isActive" | translate }}</nz-form-label>
        <nz-form-control>
          <nz-switch id="is_active" formControlName="is_active" />
        </nz-form-control>
      </nz-form-item>

      <div class="footer-actions">
        <button nz-button type="button" (click)="open.set(false)">
          {{ "common.actions.cancel" | translate }}
        </button>
        <button nz-button nzType="primary" type="submit" [nzLoading]="isSaving()">
          {{ "alerts.form.submit" | translate }}
        </button>
      </div>
    </form>
  </ng-container>
</nz-drawer>
