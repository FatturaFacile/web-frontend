<nz-drawer
  [nzVisible]="open()"
  [nzTitle]="(expense() ? 'expenses.form.editTitle' : 'expenses.form.createTitle') | translate"
  [nzWidth]="500"
  (nzOnClose)="open.set(false)"
>
  <ng-container *nzDrawerContent>
    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="date">{{ 'expenses.form.date' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'validation.dateRequired' | translate">
          <nz-date-picker id="date" formControlName="date" style="width: 100%" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired nzFor="amount">{{ 'expenses.form.amount' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'validation.amountRequired' | translate">
          <nz-input-number
            id="amount"
            formControlName="amount"
            [nzMin]="0.01"
            [nzStep]="1"
            style="width: 100%"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired nzFor="currency">{{ 'expenses.form.currency' | translate }}</nz-form-label>
        <nz-form-control>
          <nz-select id="currency" formControlName="currency">
            <nz-option nzValue="EUR" nzLabel="EUR (€)" />
            <nz-option nzValue="CHF" nzLabel="CHF (Fr.)" />
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired nzFor="description">{{ 'expenses.form.description' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'validation.descriptionRequired' | translate">
          <textarea
            nz-input
            id="description"
            formControlName="description"
            rows="3"
            [placeholder]="'expenses.form.descriptionPlaceholder' | translate"
          ></textarea>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="merchant">{{ 'expenses.form.merchant' | translate }}</nz-form-label>
        <nz-form-control>
          <input
            nz-input
            id="merchant"
            formControlName="merchant"
            [placeholder]="'expenses.form.merchantPlaceholder' | translate"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="status">{{ 'common.status.label' | translate }}</nz-form-label>
        <nz-form-control>
          <nz-select id="status" formControlName="status">
            <nz-option nzValue="draft" nzLabel="Bozza" />
            <nz-option nzValue="pending_approval" nzLabel="In Approvazione" />
            <nz-option nzValue="approved" nzLabel="Approvata" />
            <nz-option nzValue="reimbursed" nzLabel="Rimborsata" />
            <nz-option nzValue="paid" nzLabel="Pagata" />
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <div class="footer-actions">
        <button nz-button type="button" (click)="open.set(false)">{{ 'common.actions.cancel' | translate }}</button>
        <button nz-button nzType="primary" type="submit" [nzLoading]="isSaving()">
          {{ 'expenses.form.submit' | translate }}
        </button>
      </div>
    </form>
  </ng-container>
</nz-drawer>
