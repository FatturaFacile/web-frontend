<app-page-header [title]="'SC.DEBIT.TITLE' | translate" [subtitle]="'SC.DEBIT.SUBTITLE' | translate" />

<nz-card>
  @if (!canWrite()) {
    <nz-alert nzType="info" nzShowIcon [nzMessage]="'SC.COMMON.READ_ONLY' | translate" />
  } @else {
    @if (error()) {
      <nz-alert class="banner" nzType="error" nzShowIcon [nzMessage]="error()" />
    }
    <form nz-form nzLayout="vertical" [formGroup]="form">
      <div class="grid-form">
        <nz-form-item>
          <nz-form-label nzRequired nzFor="debit-invoice">{{ 'SC.DEBIT.ORIGINAL_INVOICE' | translate }}</nz-form-label>
          <nz-form-control [nzErrorTip]="'SC.COMMON.REQUIRED' | translate">
            <nz-select nzId="debit-invoice" formControlName="original_invoice_id" nzShowSearch>
              @for (i of invoices(); track i.id) {
                <nz-option [nzValue]="i.id" [nzLabel]="i.invoice_number + ' - ' + i.currency + ' ' + i.total"></nz-option>
              }
            </nz-select>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzFor="debit-date">{{ 'SC.COMMON.DATE' | translate }}</nz-form-label>
          <nz-form-control>
            <input nz-input id="debit-date" type="date" formControlName="date" />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzFor="debit-due">{{ 'SC.BILLING.DUE_DATE' | translate }}</nz-form-label>
          <nz-form-control>
            <input nz-input id="debit-due" type="date" formControlName="due_date" />
          </nz-form-control>
        </nz-form-item>
      </div>
      <app-document-lines-editor [lines]="lines" />
      <nz-form-item class="section">
        <nz-form-label nzFor="debit-notes">{{ 'SC.COMMON.NOTES' | translate }}</nz-form-label>
        <nz-form-control>
          <textarea nz-input id="debit-notes" rows="2" formControlName="notes"></textarea>
        </nz-form-control>
      </nz-form-item>
      <button nz-button nzType="primary" type="button" [nzLoading]="saving()" [disabled]="form.invalid || lines.invalid" (click)="submit()">
        <nz-icon nzType="file-text" /> {{ 'SC.DEBIT.ISSUE' | translate }}
      </button>
    </form>
  }
</nz-card>
