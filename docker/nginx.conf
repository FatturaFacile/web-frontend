server {
    listen 80;
    root /usr/share/nginx/html;

    # Regex locations match in order: index.html and the service worker files must never be cached
    location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # Hashed bundles and static assets
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
