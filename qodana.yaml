version: "1.0"

linter: jetbrains/qodana-js:2026.2

profile:
  name: qodana.recommended

include:
  - name: JSUnusedLocalSymbols
  - name: JSUnusedGlobalSymbols
  - name: TypeScriptUnresolvedReference
  - name: TypeScriptValidateTypes
  - name: HtmlUnknownAttribute
  - name: HtmlUnknownTag
  - name: AngularUndefinedBinding
  - name: AngularUndefinedTag
  - name: AngularUndefinedPipe
  - name: CheckTagEmptyBody
  
failureConditions:
  severityThresholds:
    critical: 0
    high: 0
    moderate: 800
    low: 150

  testCoverageThresholds:
    fresh: 90
    total: 85
