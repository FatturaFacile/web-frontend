<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Sagoma Foglio / Documento -->
  <!-- Contorno sinistro, base e angolo -->
  <path d="M 200,450 
           L 130,450 
           C 100,450 80,430 80,400 
           L 80,110 
           C 80,80 100,60 130,60 
           L 330,60" 
        stroke="#1E293B" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Parte superiore destra e angolo piegato -->
  <path d="M 330,60 
           L 420,150 
           L 420,280" 
        stroke="#1E293B" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <path d="M 330,60 
           L 330,150 
           L 420,150" 
        stroke="#1E293B" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Linee documento -->
  <line x1="150" y1="180" x2="270" y2="180" stroke="#1E293B" stroke-width="22" stroke-linecap="round" />
  <line x1="150" y1="240" x2="235" y2="240" stroke="#1E293B" stroke-width="22" stroke-linecap="round" />

  <!-- Spunta Checkmark Offline -->
  <path d="M 135,335 L 168,368 L 215,310" 
        stroke="#1E293B" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Nuvola Cloud/SaaS (Trasparente senza bordo bianco) -->
  <path d="M 235,455 
           A 52,52 0 0 1 230,365 
           A 72,72 0 0 1 345,300 
           A 82,82 0 0 1 455,365 
           A 56,56 0 0 1 445,455 
           Z" 
        fill="#0D9488" />

  <!-- Circuiti e nodi tecnologici dentro la nuvola -->
  <!-- Linea e nodo centrale -->
  <line x1="345" y1="452" x2="345" y2="375" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" />
  <circle cx="345" cy="370" r="11" fill="#FFFFFF" />

  <!-- Linea e nodo sinistro -->
  <path d="M 295,452 L 295,415 L 313,397" 
        stroke="#FFFFFF" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
  <circle cx="313" cy="397" r="9" fill="#FFFFFF" />

  <!-- Linea e nodo destro -->
  <path d="M 395,452 L 395,417 L 377,399" 
        stroke="#FFFFFF" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
  <circle cx="377" cy="399" r="9" fill="#FFFFFF" />
</svg>