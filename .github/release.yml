changelog:
  categories:
    - title: "🚀 New Features"
      labels:
        - "feature"
        - "enhancement"

    - title: "🐛 Bug Fixes"
      labels:
        - "fix"
        - "bug"
        - "hotfix"

    - title: "🧹 Maintenance & Refactoring"
      labels:
        - "refactor"
        - "chore"
        - "documentation"
        - "dependencies"

  exclude:
    labels:
      - "ignore-for-release"
