name: Qodana

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  qodana:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
