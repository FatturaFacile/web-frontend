name: Deploy to Pages & Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions: { }

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Run the full CI pipeline first; nothing is published unless it passes
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write
    secrets: inherit

  # Release image (Dockerfile): ghcr.io/fatturafacile/web-frontend and docker.io/fatturafacile/web, X.Y.Z + latest
  image:
    needs: ci
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Registry names must be lowercase (the org is FatturaFacile)
      - name: Image names and version
        id: vars
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "hub=docker.io/fatturafacile/web"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.ghcr }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.ghcr }}:latest
            ${{ steps.vars.outputs.hub }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.hub }}:latest
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image,ignore-error=true

  build:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Angular application
        run: pnpm run build --configuration production

      - name: Configure SPA routing for GitHub Pages
        run: |
          DIST_DIR=$(find dist -type f -name "index.html" -exec dirname {} \; | head -n 1)

          echo "Output directory: $DIST_DIR"
          echo "DIST_DIR=$DIST_DIR" >> "$GITHUB_ENV"

          cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"

      - name: Create release archives and generate checksums
        if: github.event_name == 'release'
        run: |
            TAG="${{ github.event.release.tag_name }}"
            ARCHIVE_NAME="angular-build-$TAG"

            # Crea il tar.gz
            tar -czf "${ARCHIVE_NAME}.tar.gz" -C "$DIST_DIR" .

            # Usa Python per creare lo zip in modo sicuro e multipiattaforma senza dipendenze esterne
            python3 -c "
            import shutil
            shutil.make_archive('${ARCHIVE_NAME}', 'zip', '${DIST_DIR}')
            "

                    SHA_TAR=$(sha256sum "${ARCHIVE_NAME}.tar.gz" | awk '{print $1}')
            SHA_ZIP=$(sha256sum "${ARCHIVE_NAME}.zip" | awk '{print $1}')

            echo "$SHA_TAR  ${ARCHIVE_NAME}.tar.gz" > SHA256SUMS
            echo "$SHA_ZIP  ${ARCHIVE_NAME}.zip" >> SHA256SUMS

            echo "ARCHIVE_TAR=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"
            echo "ARCHIVE_ZIP=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
            echo "CHECKSUM_FILE=SHA256SUMS" >> "$GITHUB_ENV"
            echo "SHA_TAR=${SHA_TAR}" >> "$GITHUB_ENV"
            echo "SHA_ZIP=${SHA_ZIP}" >> "$GITHUB_ENV"

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ env.ARCHIVE_TAR }}" \
            "${{ env.ARCHIVE_ZIP }}" \
            "${{ env.CHECKSUM_FILE }}" \
            --clobber

      - name: Generate categorized release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"

          EXISTING_BODY=$(gh release view "$TAG" --json body --jq '.body // ""')

          GENERATED_NOTES=$(gh api \
            -X POST \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq '.body' || echo "")

          cat <<EOF > release_notes.md
          ${EXISTING_BODY}

          ${GENERATED_NOTES}

          ## Integrity Verification (SHA-256)

          | File | SHA-256 Checksum |
          | :--- | :--- |
          | \`${{ env.ARCHIVE_TAR }}\` | \`${{ env.SHA_TAR }}\` |
          | \`${{ env.ARCHIVE_ZIP }}\` | \`${{ env.SHA_ZIP }}\` |
          EOF

          gh release edit "$TAG" --notes-file release_notes.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.DIST_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
