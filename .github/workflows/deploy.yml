name: Deploy to Pages & Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions: { }

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Angular application
        run: pnpm run build --configuration production

      - name: Configure SPA routing for GitHub Pages
        run: |
          DIST_DIR=$(find dist -type f -name "index.html" -exec dirname {} \; | head -n 1)

          echo "Output directory: $DIST_DIR"
          echo "DIST_DIR=$DIST_DIR" >> "$GITHUB_ENV"

          cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"

      - name: Create release archives and generate checksums
        if: github.event_name == 'release'
        run: |
            TAG="${{ github.event.release.tag_name }}"
            ARCHIVE_NAME="angular-build-$TAG"

            # Crea il tar.gz
            tar -czf "${ARCHIVE_NAME}.tar.gz" -C "$DIST_DIR" .

            # Usa Python per creare lo zip in modo sicuro e multipiattaforma senza dipendenze esterne
            python3 -c "
            import shutil
            shutil.make_archive('${ARCHIVE_NAME}', 'zip', '${DIST_DIR}')
            "

                    SHA_TAR=$(sha256sum "${ARCHIVE_NAME}.tar.gz" | awk '{print $1}')
            SHA_ZIP=$(sha256sum "${ARCHIVE_NAME}.zip" | awk '{print $1}')

            echo "$SHA_TAR  ${ARCHIVE_NAME}.tar.gz" > SHA256SUMS
            echo "$SHA_ZIP  ${ARCHIVE_NAME}.zip" >> SHA256SUMS

            echo "ARCHIVE_TAR=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"
            echo "ARCHIVE_ZIP=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
            echo "CHECKSUM_FILE=SHA256SUMS" >> "$GITHUB_ENV"
            echo "SHA_TAR=${SHA_TAR}" >> "$GITHUB_ENV"
            echo "SHA_ZIP=${SHA_ZIP}" >> "$GITHUB_ENV"

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ env.ARCHIVE_TAR }}" \
            "${{ env.ARCHIVE_ZIP }}" \
            "${{ env.CHECKSUM_FILE }}" \
            --clobber

      - name: Generate categorized release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"

          EXISTING_BODY=$(gh release view "$TAG" --json body --jq '.body // ""')

          GENERATED_NOTES=$(gh api \
            -X POST \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq '.body' || echo "")

          cat <<EOF > release_notes.md
          ${EXISTING_BODY}

          ${GENERATED_NOTES}

          ## Integrity Verification (SHA-256)

          | File | SHA-256 Checksum |
          | :--- | :--- |
          | \`${{ env.ARCHIVE_TAR }}\` | \`${{ env.SHA_TAR }}\` |
          | \`${{ env.ARCHIVE_ZIP }}\` | \`${{ env.SHA_ZIP }}\` |
          EOF

          gh release edit "$TAG" --notes-file release_notes.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.DIST_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
