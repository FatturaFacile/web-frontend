name: CI

on:
  # Branches other than main are checked through their pull request, so a push to
  # a PR branch no longer runs the pipeline twice
  push:
    branches:
      - main
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

  # The Vitest suite is split in parallel shards (one job each); `validate` merges their coverage and applies the gate
  unit:
    name: unit (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      VITEST_SHARDS: '6'
      VITEST_MAX_WORKERS: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests shard with coverage
        run: pnpm run test:ci --shard-only=${{ matrix.shard }}

      - name: Upload shard coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/shard-${{ matrix.shard }}/coverage-final.json
          retention-days: 1

  # Required-check name kept from the previous single job: green only if lint, every shard and the merged coverage gate pass
  validate:
    needs:
      - lint
      - unit
    runs-on: ubuntu-latest
    env:
      VITEST_SHARDS: '6'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download shard coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage-download

      - name: Merge coverage and apply the gate
        run: |
          for dir in coverage-download/coverage-shard-*; do
            n="${dir##*-}"
            mkdir -p "coverage/shard-$n"
            cp "$dir/coverage-final.json" "coverage/shard-$n/coverage-final.json"
          done
          node scripts/test-ci-sharded.mjs --merge-only

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Angular application
        run: pnpm run build --configuration production

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ng serve runs over HTTPS and reads certs/localhost.*, which are git-ignored (each developer uses mkcert):
      # in CI a throwaway self-signed pair is enough, the Playwright config ignores certificate errors.
      - name: Generate local HTTPS certificate
        run: >-
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost"
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          -keyout certs/localhost.key -out certs/localhost.crt

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: pnpm exec playwright test e2e/inventory.spec.ts e2e/invoicing.spec.ts e2e/payments.spec.ts

      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 15

  # Layout crawler on chromium (was in the ci-quality workflow, merged here so one push runs Playwright once)
  e2e-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ng serve runs over HTTPS and reads certs/localhost.*, which are git-ignored (each developer uses mkcert):
      # in CI a throwaway self-signed pair is enough, the Playwright config ignores certificate errors.
      - name: Generate local HTTPS certificate
        run: >-
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost"
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          -keyout certs/localhost.key -out certs/localhost.crt

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: pnpm exec playwright test e2e/layout-full-audit.spec.ts --project=chromium

      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-layout-report
          path: playwright-report/
          retention-days: 15

  a11y:
    needs: validate
    # Accessibility audit (axe, WCAG AA) of the pages covered by tests/accessibility*.spec.ts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same throwaway certificate as the e2e job: ng serve runs over HTTPS
      - name: Generate local HTTPS certificate
        run: >-
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost"
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          -keyout certs/localhost.key -out certs/localhost.crt

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright accessibility suite
        run: pnpm run e2e:a11y

      - name: Upload accessibility report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-a11y-report
          path: playwright-report/
          retention-days: 15

  storybook:
    needs: validate
    # The design system (Storybook) must keep building
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook

  qodana:
    # Non-blocking: the Qodana Cloud organisation has the Community licence, which does not include the JS linter.
    # The job only runs when the repository variable QODANA_ENABLED is "true" (set it once an Ultimate licence is active):
    # with the Community licence the scan always fails at start-up.
    continue-on-error: true
    # Fork and Dependabot pull requests get no repository secrets: skip what needs them
    if: >-
      vars.QODANA_ENABLED == 'true' && github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Qodana resolves Angular pipes, imports and types through node_modules: without it every
      # pipe/import is reported as unresolved (hundreds of false critical problems)
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Qodana Scan
        uses: JetBrains/qodana-action@aa698739cd4b8204ad53291bea7e16cd75da3c9f # v2026.3.1
        with:
          # Full scan also on pull requests (as on dev) and keep the SARIF report as an artifact
          pr-mode: false
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

  notify:
    needs:
      - lint
      - validate
      - build
      - e2e
      - e2e-layout
      - a11y
      - storybook
      - qodana
    # Fork and Dependabot pull requests get no repository secrets: skip what needs them
    if: >-
      always() && github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@68ac04bda0e0f4755e24649161566b4b6732cc83 # v1.1.2
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Pipeline Status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'FAILED ❌' || 'SUCCESS ✅' }}

            🚀 Repository: ${{ github.repository }}
            🌿 Branch / Ref: ${{ github.ref }}
            👤 Author: ${{ github.actor }}
            📌 Event: ${{ github.event_name }}
            🔗 Commit: ${{ github.sha }}
            📊 Jobs Overview:
            • Validate: ${{ needs.validate.result }}
            • Build: ${{ needs.build.result }}
            • E2E: ${{ needs.e2e.result }}
            • E2E layout: ${{ needs.e2e-layout.result }}
            • A11y: ${{ needs.a11y.result }}
            • Storybook: ${{ needs.storybook.result }}
            • Qodana: ${{ needs.qodana.result }}
