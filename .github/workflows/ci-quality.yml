name: Frontend Quality & Merge Gates

# Lint, build, unit tests (coverage gate) and Playwright run once, in ci.yml (also called by deploy-dev.yml).
# This workflow keeps the dependency security audit, including the weekly scheduled report.

on:
  pull_request:
    branches: [main, master, develop, dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'angular.json'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/ci-quality.yml'
  push:
    branches: [main, master, dev]
  schedule:
    # Weekly security audit every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: NPM Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Run NPM Security Audit Gate
        run: pnpm audit --audit-level=high

      - name: Generate Weekly SARIF / JSON Audit Report
        if: github.event_name == 'schedule'
        run: |
          mkdir -p reports
          pnpm audit --json > reports/npm-security-audit.json || true
        continue-on-error: true

      - name: Upload Weekly Security Artifact
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-security-audit-report
          path: reports/npm-security-audit.json
          retention-days: 30
